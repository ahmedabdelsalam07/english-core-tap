<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Core TaP — لوحة تحكم اليوزرز</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #f2f4f8;
    color: #1f2430;
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #1a5fb4, #3584e4);
    color: #fff;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .header h1 { font-size: 20px; font-weight: 700; }
  .header .sub { font-size: 13px; opacity: .85; margin-top: 2px; }
  .btn {
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .88; }
  .btn-primary { background: #3584e4; color: #fff; }
  .btn-danger { background: #e01b24; color: #fff; }
  .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,.6); color: #fff; }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
    margin: 20px auto;
    max-width: 720px;
  }
  .card h2 { font-size: 16px; margin-bottom: 14px; color: #1a5fb4; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; margin-bottom: 6px; color: #4a5060; }
  .field input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ccd2dd;
    border-radius: 8px;
    font-size: 14px;
    direction: ltr;
    text-align: right;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row .grow { flex: 1; min-width: 180px; }
  .msg { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-top: 12px; display: none; }
  .msg.ok { background: #e8f8ee; color: #197a3d; display: block; }
  .msg.err { background: #fdecec; color: #b21e2b; display: block; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: right; padding: 10px 12px; border-bottom: 1px solid #eef0f4; font-size: 14px; }
  th { color: #6a7180; font-weight: 600; font-size: 12px; }
  .empty { color: #8a90a0; text-align: center; padding: 24px; font-size: 14px; }
  .badge {
    display: inline-block; background: #e8f1fd; color: #1a5fb4;
    border-radius: 20px; padding: 3px 12px; font-size: 12px; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="header">
    <div>
      <h1>English Core TaP</h1>
      <div class="sub">لوحة تحكم المستخدمين</div>
    </div>
    <button class="btn btn-outline" id="logoutBtn" style="display:none">تسجيل الخروج</button>
  </div>

  <!-- Login -->
  <div class="card" id="loginCard">
    <h2>دخول الأدمن</h2>
    <div class="field">
      <label>كلمة مرور الأدمن</label>
      <input type="password" id="adminPassword" placeholder="••••••••" autocomplete="off">
    </div>
    <button class="btn btn-primary" id="loginBtn">دخول</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- Dashboard -->
  <div class="card" id="dashCard" style="display:none">
    <h2>إضافة مستخدم جديد</h2>
    <div class="row">
      <div class="field grow">
        <label>اسم المستخدم</label>
        <input type="text" id="newUsername" placeholder="username">
      </div>
      <div class="field grow">
        <label>كلمة المرور (6 أحرف على الأقل)</label>
        <input type="password" id="newPassword" placeholder="••••••••">
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button class="btn btn-primary" id="addBtn">إضافة</button>
      </div>
    </div>
    <div class="msg" id="addMsg"></div>

    <h2 style="margin-top:24px">المستخدمون الحاليون</h2>
    <table>
      <thead>
        <tr><th>اسم المستخدم</th><th style="width:110px"></th></tr>
      </thead>
      <tbody id="usersBody"></tbody>
    </table>
    <div class="msg" id="dashMsg"></div>
  </div>

<script>
(function () {
  let token = sessionStorage.getItem('adminToken') || '';

  function showMsg(el, text, ok) {
    el.className = 'msg ' + (ok ? 'ok' : 'err');
    el.textContent = text;
    setTimeout(function () { el.style.display = 'none'; }, 4000);
  }

  async function api(path, options) {
    const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
    if (token) headers.Authorization = 'Bearer ' + token;
    const res = await fetch(path, Object.assign({}, options, { headers }));
    let data = null;
    try { data = await res.json(); } catch (_) {}
    if (res.status === 401 && path !== '/api/admin/login') {
      sessionStorage.removeItem('adminToken');
      token = '';
      location.reload();
    }
    if (!res.ok) throw new Error((data && data.error) || 'HTTP ' + res.status);
    return data;
  }

  function renderUsers(users) {
    const tbody = document.getElementById('usersBody');
    if (!users.length) {
      tbody.innerHTML = '<tr><td colspan="2" class="empty">لا يوجد مستخدمون بعد</td></tr>';
      return;
    }
    tbody.innerHTML = users.map(function (u) {
      return '<tr>' +
        '<td><span class="badge">' + u.username + '</span></td>' +
        '<td><button class="btn btn-danger" data-del="' + u.username + '" style="padding:6px 12px;font-size:12px">حذف</button></td>' +
        '</tr>';
    }).join('');
  }

  async function loadUsers() {
    try {
      const data = await api('/api/admin/users');
      renderUsers(data.users || []);
    } catch (e) {
      showMsg(document.getElementById('dashMsg'), 'تعذر تحميل المستخدمين: ' + e.message, false);
    }
  }

  async function enterDashboard() {
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('dashCard').style.display = 'block';
    document.getElementById('logoutBtn').style.display = 'inline-block';
    await loadUsers();
  }

  document.getElementById('loginBtn').addEventListener('click', async function () {
    const password = document.getElementById('adminPassword').value;
    const msg = document.getElementById('loginMsg');
    try {
      const data = await api('/api/admin/login', {
        method: 'POST',
        body: JSON.stringify({ password: password })
      });
      token = data.token;
      sessionStorage.setItem('adminToken', token);
      msg.style.display = 'none';
      await enterDashboard();
    } catch (e) {
      showMsg(msg, 'كلمة المرور غير صحيحة', false);
    }
  });

  document.getElementById('addBtn').addEventListener('click', async function () {
    const username = document.getElementById('newUsername').value.trim();
    const password = document.getElementById('newPassword').value;
    const msg = document.getElementById('addMsg');
    if (!username || !password) {
      showMsg(msg, 'اكتب اسم المستخدم وكلمة المرور', false);
      return;
    }
    try {
      const data = await api('/api/admin/users', {
        method: 'POST',
        body: JSON.stringify({ username: username, password: password })
      });
      showMsg(msg, data.created ? 'تم إنشاء المستخدم' : 'تم تحديث كلمة المرور', true);
      document.getElementById('newUsername').value = '';
      document.getElementById('newPassword').value = '';
      await loadUsers();
    } catch (e) {
      showMsg(msg, 'فشل: ' + e.message, false);
    }
  });

  document.getElementById('usersBody').addEventListener('click', async function (e) {
    const btn = e.target.closest('[data-del]');
    if (!btn) return;
    if (!confirm('حذف المستخدم "' + btn.dataset.del + '"؟')) return;
    try {
      await api('/api/admin/users/' + encodeURIComponent(btn.dataset.del), { method: 'DELETE' });
      await loadUsers();
    } catch (e) {
      showMsg(document.getElementById('dashMsg'), 'فشل الحذف: ' + e.message, false);
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', function () {
    sessionStorage.removeItem('adminToken');
    token = '';
    location.reload();
  });

  document.getElementById('adminPassword').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });

  if (token) enterDashboard();
})();
</script>
</body>
</html>
