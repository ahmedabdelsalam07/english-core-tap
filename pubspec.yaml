name: english_core_tap
description: English Core TaP - تطبيق تعلم النطق الأمريكي مع الترجمة والكتابة الصوتية بالعربية. English Core - MR. THARWAT TAWFIQ.
publish_to: 'none'
version: 1.0.14+14

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0
  speech_to_text: ^7.0.0
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo/
    - assets/images/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
