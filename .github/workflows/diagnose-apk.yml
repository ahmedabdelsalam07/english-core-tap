name: Diagnose APK build

on:
  push:
    branches: [diag/kotlin]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build APK
        id: apk
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/apk.log | tail -n 40
          exit ${PIPESTATUS[0]}

      - name: Annotate the result
        if: always()
        shell: bash
        run: |
          echo "::error title=apk-outcome::apk step outcome was ${{ steps.apk.outcome }}"
          if [ -f /tmp/apk.log ]; then
            BODY=$(tail -n 30 /tmp/apk.log | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=apk-tail::${BODY}"
          fi
