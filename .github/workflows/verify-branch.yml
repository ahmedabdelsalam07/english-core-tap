name: Verify branch

# Temporary verification workflow for the client-requests branch.
# It never deploys anything: it analyzes and compiles so a change can be
# checked without touching main. Delete before merging.

on:
  push:
    branches: [feature/client-requests-2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localisations
        run: flutter gen-l10n

      - name: Analyze
        continue-on-error: true
        run: |
          flutter analyze > analyze.log 2>&1
          echo "flutter analyze exit: $?"
          tail -n 40 analyze.log

      - name: Build web
        continue-on-error: true
        run: |
          flutter build web --release --base-href /english-core-tap/ --pwa-strategy=none > web.log 2>&1
          echo "flutter build web exit: $?"
          tail -n 40 web.log

      - name: Build APK
        continue-on-error: true
        run: |
          flutter build apk --release > apk.log 2>&1
          echo "flutter build apk exit: $?"
          tail -n 40 apk.log

      - name: Annotate the tails
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, urllib.parse
          for label in ('analyze', 'web', 'apk'):
              p = pathlib.Path(f'{label}.log')
              if not p.exists():
                  print(f'::error title={label}::log missing')
                  continue
              tail = p.read_text(errors='replace')[-2500:]
              print(f'::error title={label}-tail::' + urllib.parse.quote(tail, safe=''))
          PY
