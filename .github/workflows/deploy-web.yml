name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href /english-core-tap/ --pwa-strategy=none

      # The APK is only a convenience mirror of the Android release hosted next
      # to the web build. Its toolchain (Gradle/AGP) can break independently of
      # the web build, so it must never block publishing the web app.
      - name: Build APK (mirror for fast regional download)
        continue-on-error: true
        run: flutter build apk --release

      - name: Copy APK into web bundle
        if: hashFiles('build/app/outputs/flutter-apk/app-release.apk') != ''
        run: cp build/app/outputs/flutter-apk/app-release.apk build/web/english-core-tap.apk

      - name: Copy privacy policy page
        run: cp tooling/privacy.html build/web/privacy.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Configure Pages
        uses: actions/configure-pages@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
